<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にほんご 학습 — 메뉴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F4EE;
    --paper-deep: #EFEBE1;
    --ink: #2A3550;
    --ink-soft: #5A6379;
    --shu: #C24036;
    --line: #DCD6C8;
    --grid: #CFC8B6;
    --radius: 14px;
    --jp: 'Zen Maru Gothic', sans-serif;
    --kr: 'IBM Plex Sans KR', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--kr);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    background-image:
      linear-gradient(var(--paper-deep) 1px, transparent 1px),
      linear-gradient(90deg, var(--paper-deep) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .app { width: 100%; max-width: 560px; padding: 40px 20px 56px; }

  header { margin-bottom: 28px; }
  .brand {
    font-family: var(--jp);
    font-weight: 900;
    font-size: 30px;
    letter-spacing: 0.02em;
    line-height: 1.25;
  }
  .brand .shu { color: var(--shu); }
  .tagline { margin-top: 8px; font-size: 14px; color: var(--ink-soft); line-height: 1.7; }

  .list-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.16em;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .menu { display: flex; flex-direction: column; gap: 12px; }
  a.item {
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: 0 2px 0 var(--line);
    transition: transform .08s, border-color .15s;
  }
  a.item:hover { border-color: var(--ink); }
  a.item:active { transform: scale(.99); }
  a.item.soon { opacity: .55; pointer-events: none; box-shadow: none; }

  .item .kanji {
    flex: none;
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--jp);
    font-weight: 900;
    font-size: 26px;
    color: var(--shu);
    background: var(--paper);
    border: 1.5px solid var(--grid);
    border-radius: 10px;
  }
  .item.soon .kanji { color: var(--ink-soft); }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
  .item .desc { font-size: 13px; color: var(--ink-soft); line-height: 1.5; }
  .item .tag {
    flex: none;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    padding: 4px 9px; border-radius: 999px;
    border: 1.5px solid var(--grid); color: var(--ink-soft);
  }
  .item .arrow { flex: none; font-size: 18px; color: var(--ink-soft); }

  footer {
    margin-top: 36px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    line-height: 1.7;
  }
  footer a { color: var(--shu); text-decoration: none; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand"><span class="shu">にほんご</span> 학습</div>
    <p class="tagline">같이 공부하는 일본어 연습장.<br>아래에서 오늘 할 걸 골라보자.</p>
  </header>

  <p class="list-label">MENU</p>
  <nav class="menu">

    <a class="item" href="./kana-dictation/">
      <span class="kanji">か</span>
      <span class="body">
        <span class="title">かな 받아쓰기</span>
        <span class="desc">한국어 단어를 히라가나·가타카나로 받아쓰는 퀴즈</span>
      </span>
      <span class="tag">퀴즈</span>
      <span class="arrow">→</span>
    </a>

    <!-- 앞으로 추가될 항목: 위 블록 복사해서 href/글자/제목만 바꾸면 됨.
         준비중 항목은 class="item soon" 으로 두면 흐리게 + 클릭 비활성 -->

  </nav>

  <footer>
    <a href="https://github.com/w0nder-official/nihongo" target="_blank" rel="noopener">w0nder-official/nihongo</a>
  </footer>

</div>
</body>
</html>
