<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>단어장</title>
    <style>
      :root {
        --paper: #faf3e7;
        --paper-line: #e4d9c4;
        --ink: #1f3a5f;
        --ink-soft: #4c6079;
        --hanko: #b23a2e;
        --hanko-soft: #d9877d;
        --gold: #b8922e;
        --card: #fffdf8;
        --shadow: rgba(31, 58, 95, 0.14);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        font-family:
          -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        color: var(--ink);
        display: flex;
        justify-content: center;
        padding: 40px 16px 64px;
      }
      .app {
        width: 100%;
        max-width: 460px;
      }
      .header {
        text-align: center;
        margin-bottom: 22px;
      }
      .header .eyebrow {
        font-size: 12px;
        letter-spacing: 2px;
        color: var(--gold);
        font-weight: 700;
        margin-bottom: 6px;
      }
      .header h1 {
        font-size: 26px;
        font-weight: 800;
        margin: 0;
        letter-spacing: 0.5px;
      }

      .view-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
      }
      .view-tab {
        flex: 1;
        border: 1px solid var(--paper-line);
        background: var(--card);
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 700;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
      }
      .view-tab.active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .view-tab span {
        opacity: 0.8;
        font-weight: 600;
      }

      /* setup panel */
      .panel {
        background: var(--card);
        border: 1px solid var(--paper-line);
        border-radius: 14px;
        padding: 18px 18px 16px;
        margin-bottom: 20px;
      }
      .panel-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .panel-row:last-child {
        margin-bottom: 0;
      }
      .panel-label {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
        white-space: nowrap;
        margin-right: 12px;
      }
      .chapter-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }
      .chip {
        border: 1px solid var(--paper-line);
        background: transparent;
        color: var(--ink-soft);
        font-size: 13px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 100px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .chip.active {
        background: var(--ink);
        border-color: var(--ink);
        color: #fff;
      }
      .toggle-group {
        display: flex;
        border: 1px solid var(--paper-line);
        border-radius: 100px;
        overflow: hidden;
      }
      .toggle-btn {
        border: none;
        background: transparent;
        padding: 6px 14px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-soft);
        cursor: pointer;
      }
      .toggle-btn.active {
        background: var(--hanko);
        color: #fff;
      }

      /* progress */
      .progress-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 13px;
        color: var(--ink-soft);
        font-weight: 600;
      }
      .progress-track {
        height: 3px;
        background: var(--paper-line);
        border-radius: 2px;
        margin-bottom: 20px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--hanko);
        transition: width 0.2s ease;
      }

      /* flashcard with genkouyoushi grid signature */
      .stage {
        perspective: 1400px;
        margin-bottom: 20px;
      }
      .card {
        position: relative;
        height: 310px;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      }
      .card.flipped {
        transform: rotateY(180deg);
      }
      .face {
        position: absolute;
        inset: 0;
        backface-visibility: hidden;
        border-radius: 16px;
        border: 1px solid var(--paper-line);
        background:
          linear-gradient(var(--paper-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
          var(--card);
        background-size:
          28px 28px,
          28px 28px,
          100% 100%;
        background-position: -1px -1px;
        box-shadow: 0 10px 28px var(--shadow);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .face::before {
        content: "";
        position: absolute;
        top: 14px;
        left: 14px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--hanko);
        opacity: 0.08;
      }
      .face .tag {
        position: absolute;
        top: 16px;
        left: 20px;
        font-size: 11px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 1px;
      }
      .face .hint {
        position: absolute;
        bottom: 16px;
        font-size: 11px;
        color: var(--ink-soft);
        opacity: 0.6;
        letter-spacing: 0.5px;
      }
      .word-main {
        font-size: 36px;
        font-weight: 800;
        color: var(--ink);
        line-height: 1.4;
        letter-spacing: -0.3px;
      }
      .word-kanji {
        font-size: 26px;
        font-weight: 700;
        color: var(--ink-soft);
        margin-top: 8px;
      }
      .back {
        transform: rotateY(180deg);
      }
      .back-line {
        margin: 9px 0;
      }
      .back-line .lbl {
        font-size: 11px;
        color: var(--gold);
        font-weight: 700;
        letter-spacing: 1px;
        display: block;
        margin-bottom: 2px;
      }
      .back-line .val {
        font-size: 28px;
        font-weight: 700;
        color: var(--ink);
      }
      .back-line .val.kanji {
        font-size: 24px;
        font-weight: 600;
        color: var(--ink-soft);
      }

      /* controls */
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 14px;
      }
      .nav-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid var(--paper-line);
        background: var(--card);
        color: var(--ink);
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      .nav-btn:hover {
        border-color: var(--ink);
      }
      .nav-btn:active {
        transform: scale(0.94);
      }
      .flip-btn {
        flex: 1;
        max-width: 200px;
        height: 46px;
        border-radius: 100px;
        border: none;
        background: var(--ink);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .flip-btn:active {
        transform: scale(0.97);
      }

      .footer-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .text-btn {
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        padding: 6px 10px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .empty {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-soft);
        font-size: 14px;
      }

      /* save buttons */
      .save-row {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin-bottom: 16px;
      }
      .save-btn {
        border: 1px solid var(--paper-line);
        background: var(--card);
        color: var(--ink-soft);
        font-size: 12px;
        font-weight: 700;
        padding: 8px 12px;
        border-radius: 100px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .save-btn.on {
        background: var(--gold);
        border-color: var(--gold);
        color: #fff;
      }

      /* saved list view */
      .saved-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .saved-item {
        background: var(--card);
        border: 1px solid var(--paper-line);
        border-radius: 12px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .saved-item .info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        cursor: pointer;
        flex: 1;
      }
      .saved-item .main {
        font-size: 18px;
        font-weight: 800;
        color: var(--ink);
      }
      .saved-kanji-mini {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-soft);
      }
      .tap-hint {
        font-size: 11px;
        color: var(--ink-soft);
        opacity: 0.55;
        margin-top: 2px;
      }
      .back-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 2px;
      }
      .sub-line {
        font-size: 15px;
        font-weight: 700;
        color: var(--ink);
      }
      .lbl-mini {
        font-size: 10px;
        font-weight: 700;
        color: var(--gold);
        letter-spacing: 0.5px;
        margin-right: 6px;
      }
      .saved-item.flipped {
        background: #fff9ee;
        border-color: var(--gold);
      }
      .saved-item .dir-badge {
        font-size: 10px;
        font-weight: 700;
        color: var(--hanko);
        letter-spacing: 0.5px;
        margin-bottom: 2px;
      }
      .del-btn {
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-size: 18px;
        cursor: pointer;
        padding: 4px 8px;
        line-height: 1;
      }
      .del-btn:hover {
        color: var(--hanko);
      }
      .saved-empty {
        text-align: center;
        padding: 50px 20px;
        color: var(--ink-soft);
        font-size: 14px;
      }

      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }
    </style>
  </head>

        { ch: 3, kr: "백화점", pron: "데파토", hira: "デパート", kanji: "-" },
        { ch: 3, kr: "수업", pron: "주교", hira: "じゅぎょう", kanji: "授業" },
        { ch: 3, kr: "역", pron: "에키", hira: "えき", kanji: "駅" },
        { ch: 3, kr: "일", pron: "시고토", hira: "しごと", kanji: "仕事" },
        { ch: 3, kr: "시간", pron: "지칸", hira: "じかん", kanji: "時間" },

        { ch: 4, kr: "학교", pron: "각코", hira: "がっこう", kanji: "学校" },
        { ch: 4, kr: "집", pron: "우치", hira: "うち", kanji: "家" },
        { ch: 4, kr: "~부터", pron: "카라", hira: "から", kanji: "-" },
        { ch: 4, kr: "멀다", pron: "토오이", hira: "とおい", kanji: "遠い" },
        { ch: 4, kr: "가깝다", pron: "치카이", hira: "ちかい", kanji: "近い" },
        {
          ch: 4,
          kr: "한국인",
          pron: "칸코쿠진",
          hira: "かんこくじん",
          kanji: "韓国人",
        },
        {
          ch: 4,
          kr: "친구",
          pron: "토모다치",
          hira: "ともだち",
          kanji: "友達",
        },
        { ch: 4, kr: "많다", pron: "오오이", hira: "おおい", kanji: "多い" },
        {
          ch: 4,
          kr: "한국어",
          pron: "칸코쿠고",
          hira: "かんこくご",
          kanji: "韓国語",
        },
        { ch: 4, kr: "공부", pron: "벤쿄", hira: "べんきょう", kanji: "勉強" },
        {
          ch: 4,
          kr: "어렵다",
          pron: "무즈카시이",
          hira: "むずかしい",
          kanji: "難しい",
        },
        {
          ch: 4,
          kr: "그렇네요",
          pron: "소오 데스네",
          hira: "そうですね",
          kanji: "-",
        },
        { ch: 4, kr: "조금", pron: "스코시", hira: "すこし", kanji: "少し" },
        {
          ch: 4,
          kr: "재미있다",
          pron: "오모시로이",
          hira: "おもしろい",
          kanji: "面白い",
        },
        { ch: 4, kr: "스시", pron: "스시", hira: "すし", kanji: "寿司" },
        {
          ch: 4,
          kr: "맛있다",
          pron: "오이시이",
          hira: "おいしい",
          kanji: "美味しい",
        },
        { ch: 4, kr: "컴퓨터", pron: "파소콘", hira: "パソコン", kanji: "-" },
        { ch: 4, kr: "비싸다", pron: "타카이", hira: "たかい", kanji: "高い" },
        {
          ch: 4,
          kr: "바쁘다",
          pron: "이소가시이",
          hira: "いそがしい",
          kanji: "忙しい",
        },
        { ch: 4, kr: "오늘", pron: "쿄오", hira: "きょう", kanji: "今日" },
        { ch: 4, kr: "덥다", pron: "아츠이", hira: "あつい", kanji: "暑い" },
        { ch: 4, kr: "한자", pron: "칸지", hira: "かんじ", kanji: "漢字" },
        { ch: 4, kr: "일", pron: "시고토", hira: "しごと", kanji: "仕事" },
        { ch: 4, kr: "날씨", pron: "텐키", hira: "てんき", kanji: "天気" },
        {
          ch: 4,
          kr: "휴대폰",
          pron: "케이타이",
          hira: "ケイタイ",
          kanji: "携帯",
        },
        { ch: 4, kr: "낡다", pron: "후루이", hira: "ふるい", kanji: "古い" },
        { ch: 4, kr: "좋다", pron: "이이", hira: "いい", kanji: "良い" },
        {
          ch: 4,
          kr: "귀엽다",
          pron: "카와이이",
          hira: "かわいい",
          kanji: "可愛い",
        },
        {
          ch: 4,
          kr: "쉽다",
          pron: "야사시이",
          hira: "やさしい",
          kanji: "易しい",
        },
        { ch: 4, kr: "춥다", pron: "사무이", hira: "さむい", kanji: "寒い" },
        { ch: 4, kr: "텔레비전", pron: "테레비", hira: "テレビ", kanji: "-" },
        {
          ch: 4,
          kr: "크다",
          pron: "오오키이",
          hira: "おおきい",
          kanji: "大きい",
        },
        {
          ch: 4,
          kr: "작다",
          pron: "치이사이",
          hira: "ちいさい",
          kanji: "小さい",
        },
        {
          ch: 4,
          kr: "새롭다",
          pron: "아타라시이",
          hira: "あたらしい",
          kanji: "新しい",
        },
        {
          ch: 4,
          kr: "적다",
          pron: "스쿠나이",
          hira: "すくない",
          kanji: "少ない",
        },
      ];

      const state = {
        chapters: new Set([1, 2, 3, 4]),
        mode: "sequential",
        dir: "kr-jp",
        deck: [],
        index: 0,
        flipped: false,
        saved: [], // {ch, kr, direction}
        savedFlipped: new Set(), // indices currently showing back
        view: "study", // "study" | "saved"
        storageReady: false,
      };

      function wordKey(w) {
        return w.ch + "_" + w.kr;
      }
      function isSaved(w, direction) {
        return state.saved.some(
          (s) => s.ch === w.ch && s.kr === w.kr && s.direction === direction,
        );
      }
      async function loadSaved() {
        try {
          const raw = localStorage.getItem("vocab-saved-words");
          state.saved = raw ? JSON.parse(raw) : [];
        } catch (e) {
          state.saved = [];
        }
        state.storageReady = true;
      }
      async function persistSaved() {
        try {
          localStorage.setItem(
            "vocab-saved-words",
            JSON.stringify(state.saved),
          );
        } catch (e) {
          console.error("저장 실패", e);
        }
      }
      function toggleSave(w, direction) {
        const idx = state.saved.findIndex(
          (s) => s.ch === w.ch && s.kr === w.kr && s.direction === direction,
        );
        if (idx >= 0) {
          state.saved.splice(idx, 1);
        } else {
          state.saved.push({ ch: w.ch, kr: w.kr, direction });
        }
        persistSaved();
        render();
      }

      function isKatakana(str) {
        return /[\u30A0-\u30FF]/.test(str);
      }
      function kanaLabel(str) {
        return isKatakana(str) ? "가타카나" : "히라가나";
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildDeck() {
        let filtered = VOCAB.filter((w) => state.chapters.has(w.ch));
        state.deck = state.mode === "random" ? shuffle(filtered) : filtered;
        state.index = 0;
        state.flipped = false;
        render();
      }

      function renderChapterChips() {
        const grid = document.getElementById("chapterGrid");
        grid.innerHTML = "";
        [1, 2, 3, 4].forEach((ch) => {
          const btn = document.createElement("button");
          btn.className = "chip" + (state.chapters.has(ch) ? " active" : "");
          btn.textContent = "챕터 " + ch;
          btn.onclick = () => {
            if (state.chapters.has(ch)) {
              if (state.chapters.size > 1) state.chapters.delete(ch);
            } else {
              state.chapters.add(ch);
            }
            renderChapterChips();
            buildDeck();
          };
          grid.appendChild(btn);
        });
      }

      function renderPanel() {
        const panel = document.getElementById("panel");
        panel.innerHTML = `
    <div class="panel-row">
      <span class="panel-label">챕터</span>
      <div class="chapter-grid" id="chapterGrid"></div>
    </div>
    <div class="panel-row">
      <span class="panel-label">순서</span>
      <div class="toggle-group">
        <button class="toggle-btn" data-mode="sequential">순서대로</button>
        <button class="toggle-btn" data-mode="random">랜덤</button>
      </div>
    </div>
    <div class="panel-row">
      <span class="panel-label">방향</span>
      <div class="toggle-group">
        <button class="toggle-btn" data-dir="kr-jp">한글 → 일본어</button>
        <button class="toggle-btn" data-dir="jp-kr">일본어 → 한글</button>
      </div>
    </div>
  `;
        renderChapterChips();
        document
          .querySelector(`[data-mode="${state.mode}"]`)
          .classList.add("active");
        document
          .querySelector(`[data-dir="${state.dir}"]`)
          .classList.add("active");
        document.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.onclick = () => {
            state.mode = btn.dataset.mode;
            document
              .querySelectorAll("[data-mode]")
              .forEach((b) => b.classList.toggle("active", b === btn));
            buildDeck();
          };
        });
        document.querySelectorAll("[data-dir]").forEach((btn) => {
          btn.onclick = () => {
            state.dir = btn.dataset.dir;
            document
              .querySelectorAll("[data-dir]")
              .forEach((b) => b.classList.toggle("active", b === btn));
            state.flipped = false;
            render();
          };
        });
      }

      function updateSavedCount() {
        document.getElementById("savedCount").textContent =
          "(" + state.saved.length + ")";
      }

      document.getElementById("tabStudy").onclick = () => {
        state.view = "study";
        document.getElementById("tabStudy").classList.add("active");
        document.getElementById("tabSaved").classList.remove("active");
        document.getElementById("panel").style.display = "";
        render();
      };
      document.getElementById("tabSaved").onclick = () => {
        state.view = "saved";
        document.getElementById("tabSaved").classList.add("active");
        document.getElementById("tabStudy").classList.remove("active");
        document.getElementById("panel").style.display = "none";
        render();
      };

      function renderSavedView() {
        const area = document.getElementById("deckArea");
        if (state.saved.length === 0) {
          area.innerHTML =
            '<div class="saved-empty">아직 저장한 단어가 없어요.<br>학습 화면에서 카드 아래 저장 버튼을 눌러보세요.</div>';
          return;
        }
        const items = state.saved
          .map((s, i) => {
            const w = VOCAB.find((v) => v.ch === s.ch && v.kr === s.kr);
            if (!w) return "";
            const isKrJp = s.direction === "kr-jp";
            const isFlipped = state.savedFlipped.has(i);

            const frontMain = isKrJp ? w.kr : w.hira;
            const frontKanji =
              !isKrJp && w.kanji !== "-"
                ? `<span class="saved-kanji-mini">${w.kanji}</span>`
                : "";

            const backHtml = isKrJp
              ? `<span class="sub-line"><span class="lbl-mini">발음</span>${w.pron}</span>
         <span class="sub-line"><span class="lbl-mini">${kanaLabel(w.hira)}</span>${w.hira}</span>
         ${w.kanji !== "-" ? `<span class="sub-line"><span class="lbl-mini">한자</span>${w.kanji}</span>` : ""}`
              : `<span class="sub-line"><span class="lbl-mini">뜻</span>${w.kr}</span>
         <span class="sub-line"><span class="lbl-mini">발음</span>${w.pron}</span>`;

            return `
      <div class="saved-item ${isFlipped ? "flipped" : ""}" data-idx="${i}">
        <div class="info" data-flip="${i}">
          <span class="dir-badge">챕터 ${w.ch} · ${isKrJp ? "한글 → 일본어" : "일본어 → 한글"}</span>
          ${
            !isFlipped
              ? `<span class="main">${frontMain}</span>${frontKanji}<span class="tap-hint">눌러서 뒤집기</span>`
              : `<div class="back-info">${backHtml}</div>`
          }
        </div>
        <button class="del-btn" data-del="${i}" aria-label="삭제">×</button>
      </div>`;
          })
          .join("");

        area.innerHTML = `<div class="saved-list">${items}</div>`;

        area.querySelectorAll("[data-flip]").forEach((el) => {
          el.onclick = () => {
            const idx = parseInt(el.dataset.flip, 10);
            if (state.savedFlipped.has(idx)) state.savedFlipped.delete(idx);
            else state.savedFlipped.add(idx);
            render();
          };
        });
        area.querySelectorAll("[data-del]").forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.del, 10);
            state.saved.splice(idx, 1);
            state.savedFlipped.delete(idx);
            persistSaved();
            render();
          };
        });
      }

      function go(delta) {
        if (state.deck.length === 0) return;
        state.index =
          (state.index + delta + state.deck.length) % state.deck.length;
        state.flipped = false;
        render();
      }

      function flip() {
        state.flipped = !state.flipped;
        render();
      }

      function render() {
        updateSavedCount();
        if (state.view === "saved") {
          renderSavedView();
          return;
        }
        const area = document.getElementById("deckArea");
        if (state.deck.length === 0) {
          area.innerHTML =
            '<div class="empty">챕터를 하나 이상 선택하세요.</div>';
          return;
        }
        const w = state.deck[state.index];
        const pct = ((state.index + 1) / state.deck.length) * 100;

        const frontIsKr = state.dir === "kr-jp";
        const kanjiLine =
          w.kanji && w.kanji !== "-"
            ? `<div class="word-kanji">${w.kanji}</div>`
            : "";
        const frontContent = frontIsKr
          ? `<span class="tag">챕터 ${w.ch} · 한글</span><div class="word-main">${w.kr}</div><span class="hint">눌러서 뒤집기</span>`
          : `<span class="tag">챕터 ${w.ch} · 일본어</span><div class="word-main">${w.hira}</div>${kanjiLine}<span class="hint">눌러서 뒤집기</span>`;

        const backContent = frontIsKr
          ? `<span class="tag">챕터 ${w.ch} · 일본어</span>
       <div class="back-line"><span class="lbl">발음</span><span class="val">${w.pron}</span></div>
       <div class="back-line"><span class="lbl">${kanaLabel(w.hira)}</span><span class="val">${w.hira}</span></div>
       <div class="back-line"><span class="lbl">한자</span><span class="val kanji">${w.kanji}</span></div>`
          : `<span class="tag">챕터 ${w.ch} · 한글</span>
       <div class="back-line"><span class="lbl">뜻</span><span class="val">${w.kr}</span></div>
       <div class="back-line"><span class="lbl">발음</span><span class="val">${w.pron}</span></div>
       <div class="back-line"><span class="lbl">한자</span><span class="val kanji">${w.kanji}</span></div>`;

        const krJpOn = isSaved(w, "kr-jp");
        const jpKrOn = isSaved(w, "jp-kr");

        area.innerHTML = `
    <div class="progress-row">
      <span>${state.index + 1} / ${state.deck.length}</span>
      <span>${state.mode === "random" ? "랜덤" : "순서대로"}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

    <div class="stage">
      <div class="card ${state.flipped ? "flipped" : ""}" id="cardEl">
        <div class="face front">${frontContent}</div>
        <div class="face back">${backContent}</div>
      </div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="이전 단어">←</button>
      <button class="flip-btn" id="flipBtn">카드 뒤집기</button>
      <button class="nav-btn" id="nextBtn" aria-label="다음 단어">→</button>
    </div>

    <div class="save-row">
      <button class="save-btn ${krJpOn ? "on" : ""}" id="saveKrJp">${krJpOn ? "★" : "☆"} 한글 → 일본어로 저장</button>
      <button class="save-btn ${jpKrOn ? "on" : ""}" id="saveJpKr">${jpKrOn ? "★" : "☆"} 일본어 → 한글로 저장</button>
    </div>

    <div class="footer-actions">
      <button class="text-btn" id="shuffleBtn">다시 섞기</button>
    </div>
  `;

        document.getElementById("cardEl").onclick = flip;
        document.getElementById("flipBtn").onclick = flip;
        document.getElementById("prevBtn").onclick = () => go(-1);
        document.getElementById("nextBtn").onclick = () => go(1);
        document.getElementById("saveKrJp").onclick = () =>
          toggleSave(w, "kr-jp");
        document.getElementById("saveJpKr").onclick = () =>
          toggleSave(w, "jp-kr");
        document.getElementById("shuffleBtn").onclick = () => {
          state.deck = shuffle(state.deck);
          state.index = 0;
          state.flipped = false;
          render();
        };
      }

      async function init() {
        await loadSaved();
        renderPanel();
        buildDeck();
      }
      init();
    </script>
  </body>
</html>
