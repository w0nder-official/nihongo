<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JLPT 단어장</title>
    <style>
      :root {
        --bg-main: #ffffff;
        --bg-sub: #f7f7f5;
        --bg-hover: rgba(55, 53, 47, 0.08);
        --bg-active: rgba(55, 53, 47, 0.16);
        --text-main: #37352f;
        --text-soft: rgba(55, 53, 47, 0.65);
        --border-color: rgba(55, 53, 47, 0.16);
        --border-light: rgba(55, 53, 47, 0.09);
        --hanko: #eb5757;
        
        /* Compatibility with JS inline styles */
        --ink-soft: var(--text-soft);
        --paper-line: var(--border-light);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg-main);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
        color: var(--text-main);
        display: flex;
        justify-content: center;
        padding: 40px 16px 64px;
        line-height: 1.5;
      }
      .app { width: 100%; max-width: 540px; }
      .header { margin-bottom: 32px; display: flex; align-items: center; gap: 12px; }
      .header-icon { font-size: 32px; }
      .header h1 { font-size: 32px; font-weight: 700; margin: 0; letter-spacing: -0.03em; }

      .level-tabs, .view-tabs { display: flex; gap: 4px; margin-bottom: 24px; overflow-x: auto; border-bottom: 1px solid var(--border-light); padding-bottom: 8px; }
      .level-tab, .view-tab {
        border: none; background: transparent; color: var(--text-soft); font-size: 14px; font-weight: 500;
        padding: 6px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap; transition: all 0.1s ease;
      }
      .level-tab:hover, .view-tab:hover { background: var(--bg-hover); color: var(--text-main); }
      .level-tab.active, .view-tab.active { background: var(--bg-active); color: var(--text-main); font-weight: 600; }
      .level-tab.disabled { opacity: 0.5; pointer-events: none; }

      .view-tabs { border-bottom: none; }

      /* setup panel */
      .panel { margin-bottom: 32px; }
      .panel-row { display: flex; align-items: flex-start; margin-bottom: 16px; }
      .panel-label { font-size: 14px; font-weight: 600; color: var(--text-main); min-width: 60px; margin-top: 4px; }
      .chapter-grid { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; overflow: hidden; }
      .chapter-grid.collapsed { max-height: 96px; }
      .chapter-grid.expanded { max-height: none; }
      .chip {
        border: 1px solid var(--border-light); background: transparent; color: var(--text-soft);
        font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 6px;
        cursor: pointer; transition: all 0.1s ease;
      }
      .chip:hover { background: var(--bg-hover); border-color: rgba(55, 53, 47, 0.2); color: var(--text-main); }
      .chip.active { background: var(--text-main); border-color: var(--text-main); color: #fff; }
      .toggle-group { display: flex; border: 1px solid var(--border-light); border-radius: 6px; overflow: hidden; background: var(--bg-main); }
      .toggle-btn {
        border: none; background: transparent; padding: 6px 12px;
        font-size: 13px; font-weight: 500; color: var(--text-soft); cursor: pointer;
        border-right: 1px solid var(--border-light); transition: all 0.1s ease;
      }
      .toggle-btn:last-child { border-right: none; }
      .toggle-btn:hover { background: var(--bg-hover); color: var(--text-main); }
      .toggle-btn.active { background: var(--bg-active); color: var(--text-main); font-weight: 600; }

      /* progress */
      .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--text-soft); font-weight: 500; }
      .progress-track { height: 4px; background: var(--bg-sub); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
      .progress-fill { height: 100%; background: var(--text-main); transition: width 0.2s ease; border-radius: 2px; }

      .radicals { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
      .radical-chip { display: flex; align-items: center; background: var(--bg-main); padding: 6px 12px; border-radius: 6px; font-size: 18px; border: 1px solid var(--border-light); }
      .radical-target { font-weight: 600; color: var(--text-main); margin-right: 8px; padding-right: 8px; border-right: 1px solid var(--border-light); }
      .radical-kanji { font-weight: 600; color: var(--text-soft); margin-right: 6px; }
      .radical-meaning { color: var(--text-soft); font-size: 15px; }

      /* flashcard */
      .deck-layout { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
      .stage { perspective: 1400px; flex: 1; }
      .card { position: relative; height: 420px; cursor: pointer; transform-style: preserve-3d; transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .card.flipped { transform: rotateY(180deg); }
      .face {
        position: absolute; inset: 0; backface-visibility: hidden; border-radius: 8px;
        background: var(--bg-main);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 32px; text-align: center; border: 1px solid var(--border-light);
        transition: border-color 0.2s ease;
      }
      .card:hover .face { border-color: rgba(55, 53, 47, 0.2); }
      .face .tag { position: absolute; top: 16px; left: 16px; font-size: 12px; font-weight: 500; color: var(--text-soft); background: var(--bg-sub); padding: 4px 8px; border-radius: 4px; }
      .face .hint { position: absolute; bottom: 16px; font-size: 12px; color: var(--text-soft); opacity: 0.8; }
      .word-main { font-size: 60px; font-weight: 700; color: var(--text-main); line-height: 1.3; letter-spacing: -0.02em; }
      .word-kanji { font-size: 36px; font-weight: 600; color: var(--text-soft); margin-top: 8px; }
      .back { transform: rotateY(180deg); }
      .back-line { margin: 12px 0; display: flex; flex-direction: column; align-items: center; }
      .back-line .lbl { font-size: 16px; color: var(--text-soft); font-weight: 500; margin-bottom: 6px; }
      .back-line .val { font-size: 36px; font-weight: 600; color: var(--text-main); }
      .back-line .val.kanji { font-size: 30px; font-weight: 500; color: var(--text-soft); }

      /* controls & save panel */
      .nav-btn {
        width: 44px; height: 44px; border-radius: 6px; border: 1px solid var(--border-light);
        background: var(--bg-main); color: var(--text-main); font-size: 18px; cursor: pointer;
        display: flex; align-items: center; justify-content: center; transition: all 0.1s ease;
        flex-shrink: 0;
      }
      .nav-btn:hover { background: var(--bg-hover); border-color: rgba(55, 53, 47, 0.2); }
      .nav-btn:active { background: var(--bg-active); }
      .save-row-panel { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
      .save-row-panel .chip { border-radius: 100px; padding: 4px 12px; }

      .footer-actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }
      .text-btn {
        border: none; background: transparent; color: var(--text-soft); font-size: 13px;
        font-weight: 500; cursor: pointer; padding: 6px 12px; border-radius: 4px;
      }
      .text-btn:hover { background: var(--bg-hover); color: var(--text-main); }
      .empty { text-align: center; padding: 60px 20px; color: var(--text-soft); font-size: 14px; }
      
      /* help button */
      .help-btn-wrapper { position: relative; margin-left: 8px; display: inline-flex; align-items: center; }
      .help-btn {
        width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border-light);
        background: var(--bg-main); color: var(--text-soft); font-size: 13px; font-weight: 600;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        transition: all 0.1s ease;
      }
      .help-btn:hover { background: var(--bg-hover); border-color: rgba(55, 53, 47, 0.2); color: var(--text-main); }
      .help-tooltip {
        position: absolute; top: 36px; left: 0; background: var(--text-main); color: #fff;
        padding: 12px 16px; border-radius: 8px; font-size: 13px; white-space: nowrap;
        opacity: 0; pointer-events: none; transform: translateY(-4px); transition: all 0.2s ease;
        box-shadow: rgba(15, 15, 15, 0.2) 0px 4px 12px; line-height: 1.6; z-index: 100;
      }
      .help-tooltip.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
      .help-tooltip code {
        background: rgba(255, 255, 255, 0.2); padding: 2px 4px; border-radius: 4px;
        font-family: ui-monospace, monospace; font-size: 11px; margin: 0 2px;
      }

      /* saved list view */
      .saved-list { display: flex; flex-direction: column; gap: 8px; }
      .saved-item {
        background: var(--bg-main); border: 1px solid var(--border-light); border-radius: 6px;
        padding: 12px 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
        transition: border-color 0.1s ease;
      }
      .saved-item:hover { border-color: rgba(55, 53, 47, 0.2); }
      .saved-item .info { display: flex; flex-direction: column; gap: 4px; cursor: pointer; flex: 1; }
      .saved-item .main { font-size: 16px; font-weight: 600; color: var(--text-main); }
      .tap-hint { font-size: 12px; color: var(--text-soft); }
      .back-info { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border-light); }
      .sub-line { font-size: 14px; color: var(--text-main); display: flex; flex-direction: column; }
      .lbl-mini { font-size: 11px; font-weight: 500; color: var(--text-soft); margin-bottom: 2px; }
      .saved-item.flipped { background: var(--bg-sub); }
      .saved-item .dir-badge { font-size: 11px; font-weight: 500; color: var(--text-soft); margin-bottom: 4px; display: inline-block; background: var(--bg-main); border: 1px solid var(--border-light); padding: 2px 6px; border-radius: 4px; align-self: flex-start; }
      .del-btn { border: none; background: transparent; color: var(--text-soft); font-size: 18px; cursor: pointer; padding: 4px; border-radius: 4px; line-height: 1; }
      .del-btn:hover { background: var(--bg-hover); color: var(--text-main); }
      .saved-empty { text-align: center; padding: 60px 20px; color: var(--text-soft); font-size: 14px; }

      @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <span class="header-icon">📓</span>
        <h1>JLPT 단어장</h1>
        <div class="help-btn-wrapper">
          <button class="help-btn" id="helpBtn" aria-label="도움말">?</button>
          <div class="help-tooltip" id="helpTooltip">
            <div style="font-weight: 600; margin-bottom: 6px;">단축키 안내</div>
            <div><code>Enter</code> <code>Space</code> : 카드 뒤집기</div>
            <div><code>←</code> <code>→</code> : 이전/다음 단어</div>
          </div>
        </div>
      </div>

      <div class="level-tabs">
        <button class="level-tab active" data-level="N5">N5</button>
        <button class="level-tab" data-level="N4">N4</button>
        <button class="level-tab" data-level="N3">N3</button>
        <button class="level-tab" data-level="N2">N2</button>
        <button class="level-tab" data-level="N1">N1</button>
      </div>

      <div class="view-tabs">
        <button class="view-tab active" id="tabStudy">학습</button>
        <button class="view-tab" id="tabSaved">저장한 단어 <span id="savedCount">(0)</span></button>
      </div>

      <div class="panel" id="panel"></div>

      <div id="deckArea"></div>
      <div style="text-align: center; font-size: 11px; color: var(--text-soft); margin-top: 30px; margin-bottom: 20px; opacity: 0.7;">
        단어 데이터 출처: <a href="https://github.com/elzup/jlpt-word-list/tree/master" target="_blank" style="color: inherit; text-decoration: underline;">elzup/jlpt-word-list</a>
      </div>
    </div>



    <script>
      let VOCAB = [];
      let FURIGANA = {};
      let RADICALS = {};

      const state = {
        level: "N5",
        chapters: new Set([1]),
        mode: "sequential",
        dir: "kr-jp",
        deck: [],
        index: 0,
        flipped: false,
        saved: [],
        savedFlipped: new Set(),
        view: "study",
        storageReady: false,
        chaptersExpanded: false,
      };
      
      const cachedVocab = {};

      function wordKey(w) { return w.ch + "_" + w.kr; }
      function isSaved(w, direction) { return state.saved.some(s => s.ch === w.ch && s.kr === w.kr && s.direction === direction); }
      
      async function loadSaved() {
        try {
          const raw = localStorage.getItem("vocab-saved-words-" + state.level.toLowerCase());
          state.saved = raw ? JSON.parse(raw) : [];
        } catch (e) { state.saved = []; }
        state.storageReady = true;
      }
      
      async function persistSaved() {
        try {
          localStorage.setItem("vocab-saved-words-" + state.level.toLowerCase(), JSON.stringify(state.saved));
        } catch (e) { console.error("저장 실패", e); }
      }
      
      function toggleSave(w, direction) {
        const idx = state.saved.findIndex(s => s.ch === w.ch && s.kr === w.kr && s.direction === direction);
        if (idx >= 0) { state.saved.splice(idx, 1); } else { state.saved.push({ ch: w.ch, kr: w.kr, direction }); }
        persistSaved();
        render();
      }

      function isKatakana(str) { return /[\u30A0-\u30FF]/.test(str); }
      function kanaLabel(str) { return isKatakana(str) ? "가타카나" : "히라가나"; }
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildDeck() {
        let filtered = VOCAB.filter((w) => state.chapters.has(w.ch));
        state.deck = state.mode === "random" ? shuffle(filtered) : filtered;
        state.index = 0;
        state.flipped = false;
        render();
      }

      function renderChapterChips() {
        const grid = document.getElementById("chapterGrid");
        grid.innerHTML = "";
        const maxCh = VOCAB.length > 0 ? Math.max(...VOCAB.map(v => v.ch)) : 1;
        const chArray = Array.from({length: maxCh}, (_, i) => i + 1);
        chArray.forEach((ch) => {
          const btn = document.createElement("button");
          btn.className = "chip" + (state.chapters.has(ch) ? " active" : "");
          btn.textContent = "챕터 " + ch;
          btn.onclick = () => {
            if (state.chapters.has(ch)) { if (state.chapters.size > 1) state.chapters.delete(ch); } 
            else { state.chapters.add(ch); }
            renderChapterChips();
            buildDeck();
          };
          grid.appendChild(btn);
        });
        const selectAllBtn = document.getElementById("selectAllChapters");
        if (selectAllBtn) {
          selectAllBtn.textContent = (state.chapters.size === maxCh) ? "전체 해제" : "전체 선택";
        }
      }

      function renderPanel() {
        const panel = document.getElementById("panel");
        panel.innerHTML = `
          <div class="panel-row">
            <span class="panel-label">챕터</span>
            <div style="flex: 1; display: flex; flex-direction: column;">
              <div class="chapter-grid ${state.chaptersExpanded ? 'expanded' : 'collapsed'}" id="chapterGrid"></div>
              <div style="display: flex; justify-content: space-between; margin-top: 8px;">
                <button class="text-btn" style="padding: 4px 8px; font-size: 12px; background: var(--bg-sub);" id="selectAllChapters">전체 선택</button>
                <button class="text-btn" style="padding: 4px 8px; font-size: 12px; background: var(--bg-sub);" id="toggleChapterHeight">${state.chaptersExpanded ? '접기 ▲' : '더보기 ▼'}</button>
              </div>
            </div>
          </div>
          <div class="panel-row">
            <span class="panel-label">순서</span>
            <div class="toggle-group">
              <button class="toggle-btn" data-mode="sequential">순서대로</button>
              <button class="toggle-btn" data-mode="random">랜덤</button>
            </div>
          </div>
          <div class="panel-row">
            <span class="panel-label">방향</span>
            <div class="toggle-group">
              <button class="toggle-btn" data-dir="kr-jp">한글 → 일본어</button>
              <button class="toggle-btn" data-dir="jp-kr">일본어 → 한글</button>
            </div>
          </div>
          <div class="panel-row">
            <span class="panel-label">단어 저장</span>
            <div class="save-row-panel" id="panelSaveRow"></div>
          </div>
        `;
        renderChapterChips();
        
        document.getElementById("selectAllChapters").onclick = () => {
          const maxCh = VOCAB.length > 0 ? Math.max(...VOCAB.map(v => v.ch)) : 1;
          if (state.chapters.size === maxCh) {
            state.chapters.clear();
            state.chapters.add(1);
          } else {
            for(let i = 1; i <= maxCh; i++) state.chapters.add(i);
          }
          renderChapterChips();
          buildDeck();
        };

        document.getElementById("toggleChapterHeight").onclick = () => {
          state.chaptersExpanded = !state.chaptersExpanded;
          const grid = document.getElementById("chapterGrid");
          const btn = document.getElementById("toggleChapterHeight");
          if (state.chaptersExpanded) {
            grid.classList.replace("collapsed", "expanded");
            btn.textContent = "접기 ▲";
          } else {
            grid.classList.replace("expanded", "collapsed");
            btn.textContent = "더보기 ▼";
          }
        };
        document.querySelector(`[data-mode="${state.mode}"]`).classList.add("active");
        document.querySelector(`[data-dir="${state.dir}"]`).classList.add("active");
        document.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.onclick = () => {
            state.mode = btn.dataset.mode;
            document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("active", b === btn));
            buildDeck();
          };
        });
        document.querySelectorAll("[data-dir]").forEach((btn) => {
          btn.onclick = () => {
            state.dir = btn.dataset.dir;
            document.querySelectorAll("[data-dir]").forEach((b) => b.classList.toggle("active", b === btn));
            state.flipped = false;
            render();
          };
        });
      }

      function updateSavedCount() {
        document.getElementById("savedCount").textContent = "(" + state.saved.length + ")";
      }

      document.getElementById("tabStudy").onclick = () => {
        state.view = "study";
        document.getElementById("tabStudy").classList.add("active");
        document.getElementById("tabSaved").classList.remove("active");
        document.getElementById("panel").style.display = "";
        render();
      };
      document.getElementById("tabSaved").onclick = () => {
        state.view = "saved";
        document.getElementById("tabSaved").classList.add("active");
        document.getElementById("tabStudy").classList.remove("active");
        document.getElementById("panel").style.display = "none";
        render();
      };

      document.querySelectorAll(".level-tab").forEach(tab => {
        tab.onclick = async () => {
          if (tab.classList.contains("disabled")) return;
          state.level = tab.dataset.level;
          document.querySelectorAll(".level-tab").forEach(t => t.classList.toggle("active", t === tab));
          await loadLevelData();
        };
      });

      function renderSavedView() {
        const area = document.getElementById("deckArea");
        if (state.saved.length === 0) {
          area.innerHTML = '<div class="saved-empty">아직 저장한 단어가 없어요.<br>학습 화면에서 카드 아래 저장 버튼을 눌러보세요.</div>';
          return;
        }
        const items = state.saved.map((s, i) => {
          const w = VOCAB.find((v) => v.ch === s.ch && v.kr === s.kr);
          if (!w) return "";
          const isKrJp = s.direction === "kr-jp";
          const isFlipped = state.savedFlipped.has(i);
          const radicalsHtml = buildRadicals(w.kanji);
          const jpDisplay = (w.kanji && w.kanji !== "-") ? buildInvertedRuby(w.kanji, w.hira) : w.hira;
          const frontMain = isKrJp ? w.kr : jpDisplay;
          const backHtml = isKrJp
            ? `<span class="sub-line"><span class="lbl-mini">${kanaLabel(w.hira)}/한자</span><span style="line-height: 1.6;">${jpDisplay}</span></span>
               ${radicalsHtml}`
            : `<span class="sub-line"><span class="lbl-mini">뜻</span>${w.kr}</span>
               <span class="sub-line"><span class="lbl-mini">${kanaLabel(w.hira)}/한자</span><span style="line-height: 1.6;">${jpDisplay}</span></span>
               ${radicalsHtml}`;

          return `
            <div class="saved-item ${isFlipped ? "flipped" : ""}" data-idx="${i}">
              <div class="info" data-flip="${i}">
                <span class="dir-badge">챕터 ${w.ch} · ${isKrJp ? "한글 → 일본어" : "일본어 → 한글"}</span>
                ${ !isFlipped
                    ? `<span class="main">${frontMain}</span><span class="tap-hint">눌러서 뒤집기</span>`
                    : `<div class="back-info">${backHtml}</div>` }
              </div>
              <button class="del-btn" data-del="${i}" aria-label="삭제">×</button>
            </div>`;
        }).join("");
        area.innerHTML = `<div class="saved-list">${items}</div>`;
        area.querySelectorAll("[data-flip]").forEach((el) => {
          el.onclick = () => {
            const idx = parseInt(el.dataset.flip, 10);
            if (state.savedFlipped.has(idx)) state.savedFlipped.delete(idx);
            else state.savedFlipped.add(idx);
            render();
          };
        });
        area.querySelectorAll("[data-del]").forEach((btn) => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const idx = parseInt(btn.dataset.del, 10);
            state.saved.splice(idx, 1);
            state.savedFlipped.delete(idx);
            persistSaved();
            render();
          };
        });
      }

      function go(delta) {
        if (state.deck.length === 0) return;
        state.index = (state.index + delta + state.deck.length) % state.deck.length;
        state.flipped = false;
        render();
      }

      function flip() { state.flipped = !state.flipped; render(); }

      function buildInvertedRuby(kanji, hira) {
        if (!kanji || kanji === "-" || kanji === hira) return hira || kanji;
        let start = 0;
        while (start < kanji.length && start < hira.length && kanji[start] === hira[start]) start++;
        let endK = kanji.length - 1;
        let endH = hira.length - 1;
        while (endK >= start && endH >= start && kanji[endK] === hira[endH]) { endK--; endH--; }
        if (start > endK) return hira; 
        
        const prefix = hira.substring(0, start);
        const reading = hira.substring(start, endH + 1);
        const kanjiBase = kanji.substring(start, endK + 1);
        const suffix = hira.substring(endH + 1);

        if (FURIGANA[kanjiBase]) {
           let html = prefix;
           const splits = FURIGANA[kanjiBase];
           for (let i = 0; i < kanjiBase.length; i++) {
              const r = splits[i] !== undefined ? splits[i] : kanjiBase[i];
              if (r !== "") {
                 html += `<ruby style="ruby-position: under;"><span style="border-bottom: 2px solid var(--hanko); padding-bottom: 2px; margin-right: 2px;">${r}</span><rt style="font-size: 0.75em; font-weight: 700; color: var(--text-main); padding-top: 2px;">${kanjiBase[i]}</rt></ruby>`;
              } else {
                 html += `<ruby style="ruby-position: under;"><span style="border-bottom: 2px solid var(--hanko); padding-bottom: 2px; margin-right: 2px; padding-left: 0.5em;">&nbsp;</span><rt style="font-size: 0.75em; font-weight: 700; color: var(--text-main); padding-top: 2px;">${kanjiBase[i]}</rt></ruby>`;
              }
           }
           html += suffix;
           return html;
        }

        return `${prefix}<ruby style="ruby-position: under;"><span style="border-bottom: 2px solid var(--hanko); padding-bottom: 2px;">${reading}</span><rt style="font-size: 0.75em; font-weight: 700; color: var(--text-main); padding-top: 2px;">${kanjiBase}</rt></ruby>${suffix}`;
      }

      function buildRadicals(kanjiStr) {
        if (!kanjiStr || kanjiStr === "-" || Object.keys(RADICALS).length === 0) return "";
        const chars = kanjiStr.match(/[\u4e00-\u9faf]/g);
        if (!chars) return "";
        let found = [];
        let seen = new Set();
        for (let char of chars) {
           if (RADICALS[char] && !seen.has(char)) {
             seen.add(char);
             found.push(`<div class="radical-chip"><span class="radical-target">${char}</span><span class="radical-kanji">${RADICALS[char].radical}</span><span class="radical-meaning">${RADICALS[char].meaning}</span></div>`);
           }
        }
        if (found.length === 0) return "";
        return `<div class="radicals">${found.join('')}</div>`;
      }

      function render() {
        updateSavedCount();
        if (state.view === "saved") { renderSavedView(); return; }
        const area = document.getElementById("deckArea");
        if (state.deck.length === 0) { area.innerHTML = '<div class="empty">챕터를 하나 이상 선택하세요.</div>'; return; }
        const w = state.deck[state.index];
        const pct = ((state.index + 1) / state.deck.length) * 100;
        const frontIsKr = state.dir === "kr-jp";
        const jpMain = (w.kanji && w.kanji !== "-") ? buildInvertedRuby(w.kanji, w.hira) : w.hira;
        
        const frontContent = frontIsKr
          ? `<span class="tag">챕터 ${w.ch} · 한글</span><div class="word-main">${w.kr}</div><span class="hint">눌러서 뒤집기</span>`
          : `<span class="tag">챕터 ${w.ch} · 일본어</span><div class="word-main" style="line-height: 1.6;">${jpMain}</div><span class="hint">눌러서 뒤집기</span>`;

        const radicalsHtml = buildRadicals(w.kanji);
        const radicalsBackLine = radicalsHtml ? `<div class="back-line" style="margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--paper-line); width: 100%;"><span class="lbl">부수</span>${radicalsHtml}</div>` : "";

        const backContent = frontIsKr
          ? `<span class="tag">챕터 ${w.ch} · 일본어</span>
             <div class="back-line"><span class="lbl">${kanaLabel(w.hira)}/한자</span><span class="val" style="line-height: 1.6;">${jpMain}</span></div>
             ${radicalsBackLine}`
          : `<span class="tag">챕터 ${w.ch} · 한글</span>
             <div class="back-line"><span class="lbl">뜻</span><span class="val">${w.kr}</span></div>
             <div class="back-line"><span class="lbl">${kanaLabel(w.hira)}/한자</span><span class="val" style="line-height: 1.6;">${jpMain}</span></div>
             ${radicalsBackLine}`;

        const krJpOn = isSaved(w, "kr-jp");
        const jpKrOn = isSaved(w, "jp-kr");

        area.innerHTML = `
          <div class="progress-row"><span>${state.index + 1} / ${state.deck.length}</span><span>${state.mode === "random" ? "랜덤" : "순서대로"}</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          
          <div class="deck-layout">
            <button class="nav-btn" id="prevBtn" aria-label="이전 단어">←</button>
            <div class="stage">
              <div class="card ${state.flipped ? "flipped" : ""}" id="cardEl">
                <div class="face front">${frontContent}</div>
                <div class="face back">${backContent}</div>
              </div>
            </div>
            <button class="nav-btn" id="nextBtn" aria-label="다음 단어">→</button>
          </div>
          
          <div class="footer-actions">
            <button class="text-btn" id="shuffleBtn">다시 섞기</button>
          </div>
        `;
        
        const panelSaveRow = document.getElementById("panelSaveRow");
        if (panelSaveRow) {
          panelSaveRow.innerHTML = `
            <button class="chip ${krJpOn ? "active" : ""}" id="saveKrJp">${krJpOn ? "✓ 한글 → 일어" : "+ 한글 → 일어"}</button>
            <button class="chip ${jpKrOn ? "active" : ""}" id="saveJpKr">${jpKrOn ? "✓ 일어 → 한글" : "+ 일어 → 한글"}</button>
          `;
          document.getElementById("saveKrJp").onclick = () => toggleSave(w, "kr-jp");
          document.getElementById("saveJpKr").onclick = () => toggleSave(w, "jp-kr");
        }

        document.getElementById("cardEl").onclick = flip;
        document.getElementById("prevBtn").onclick = () => go(-1);
        document.getElementById("nextBtn").onclick = () => go(1);
        document.getElementById("shuffleBtn").onclick = () => { state.deck = shuffle(state.deck); state.index = 0; state.flipped = false; render(); };
      }

      async function loadLevelData() {
        if (!cachedVocab[state.level]) {
          try {
            const res = await fetch(`data/JLPT-${state.level}/vocabulary.json`);
            if (res.ok) {
              cachedVocab[state.level] = await res.json();
            } else {
              cachedVocab[state.level] = [];
            }
          } catch(e) {
            console.error("Failed to load vocab for", state.level, e);
            cachedVocab[state.level] = [];
          }
        }
        VOCAB = cachedVocab[state.level];
        state.chapters = new Set([1]);
        state.savedFlipped.clear();
        await loadSaved();
        renderPanel();
        buildDeck();
      }

      async function init() {
        try {
          const radRes = await fetch('data/radicals.json');
          if (radRes.ok) RADICALS = await radRes.json();
          const furRes = await fetch('data/furigana.json');
          if (furRes.ok) FURIGANA = await furRes.json();
        } catch (e) { console.error("Global data loading failed", e); }
        await loadLevelData();
      }
      
      document.getElementById('helpBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById('helpTooltip').classList.toggle('show');
      });
      document.addEventListener('click', () => {
        const tooltip = document.getElementById('helpTooltip');
        if (tooltip && tooltip.classList.contains('show')) tooltip.classList.remove('show');
      });
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (state.view !== "study" || state.deck.length === 0) return;

        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          flip();
        } else if (e.key === 'ArrowLeft') {
          e.preventDefault();
          go(-1);
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          go(1);
        }
      });
      
      init();
    </script>
  </body>
</html>
